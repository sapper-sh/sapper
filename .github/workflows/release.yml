name: release
on:
  push:
    tags: ['v*']
permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # upload release assets
      id-token: write   # cosign keyless signing (Sigstore OIDC)
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: reproducible builds
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export CGO_ENABLED=0
          v="${GITHUB_REF_NAME}"
          flags="-s -w -buildid= -X github.com/sapper-unbuilt/sapper/internal/cli.Version=$v"
          mkdir -p dist
          for p in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${p%/*}; arch=${p#*/}; ext=; [ "$os" = windows ] && ext=.exe
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$flags" -o "dist/sapper-$v-$os-$arch$ext" ./cmd/sapper
          done
          # fixed mtimes so any archive made from dist/ is reproducible too
          find dist -exec touch -d "@$SOURCE_DATE_EPOCH" {} +
      - name: CycloneDX SBOMs
        run: |
          set -euo pipefail
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
          cyclonedx-gomod mod -licenses -json -output "dist/sapper-${GITHUB_REF_NAME}.module.cdx.json"
          cyclonedx-gomod app -json -main cmd/sapper -output "dist/sapper-${GITHUB_REF_NAME}.app.cdx.json"
      - name: SHA256SUMS and cosign keyless signature
        id: hash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          echo "hashes=$(base64 -w0 SHA256SUMS)" >> "$GITHUB_OUTPUT"
      - name: upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" dist/*

  provenance:
    needs: build
    permissions:
      actions: read     # read the workflow run
      id-token: write   # sign the provenance
      contents: write   # attach it to the release
    # The SLSA generator must be referenced by its release tag, not a commit SHA:
    # its verifier identifies the builder by tag. v2.1.0 is commit
    # f7dd8c54c2067bafc12ca7a55595d5ee9b75204a.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: true
      draft-release: true
