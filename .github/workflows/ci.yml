name: ci
on: [push, pull_request]
permissions: read-all

env:
  RESTIC_VERSION: 0.17.3
  # sha256 of restic_0.17.3_linux_amd64.bz2, from the release's SHA256SUMS.
  RESTIC_SHA256: 5097faeda6aa13167aae6e36efdba636637f8741fed89bbf015678334632d4d3
  STATICCHECK_VERSION: v0.8.2   # staticcheck 2026.2.2
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: install restic (Linux, official release binary)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          f=restic_${RESTIC_VERSION}_linux_amd64.bz2
          curl -fsSLo "$f" "https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}/$f"
          echo "${RESTIC_SHA256}  $f" | sha256sum -c -
          bunzip2 "$f"
          sudo install -m 0755 "restic_${RESTIC_VERSION}_linux_amd64" /usr/local/bin/restic
          restic version
      - run: go vet ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go install honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION} && staticcheck ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} && govulncheck ./...
      - run: make cross

  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build twice with separate caches and compare
        run: |
          set -euo pipefail
          flags="-s -w -buildid= -X github.com/sapper-sh/sapper/internal/cli.Version=ci"
          for d in a b; do
            GOCACHE="$RUNNER_TEMP/cache-$d" CGO_ENABLED=0 go build -trimpath -ldflags "$flags" -o "$RUNNER_TEMP/$d/sapper" ./cmd/sapper
          done
          sha256sum "$RUNNER_TEMP"/a/sapper "$RUNNER_TEMP"/b/sapper
          cmp "$RUNNER_TEMP"/a/sapper "$RUNNER_TEMP"/b/sapper

  installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck install.sh (preinstalled on ubuntu runners)
        run: shellcheck --version && shellcheck install.sh

  installer-ps1:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: parse and PSScriptAnalyzer install.ps1
        shell: pwsh
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errs) | Out-Null
          if ($errs) { $errs | Format-List; exit 1 }
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Force -Scope CurrentUser }
          $r = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Error,Warning -ExcludeRule PSAvoidUsingWriteHost
          if ($r) { $r | Format-Table -AutoSize; exit 1 }
